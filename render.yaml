services:
  - type: web
    name: pqr-web
    runtime: python
    rootDir: pqr_web_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PQR_GOOGLE_SHEET_TAB
        value: Data
      - key: PQR_ADMIN_USERNAME
        value: admin
      - key: PQR_ADMIN_PASSWORD
        sync: false
      - key: PQR_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PQR_GOOGLE_SHEET_ID
        sync: false
      - key: PQR_PHIVOLCS_SYNC_SECONDS
        value: 15
      - key: PQR_GOOGLE_SYNC_SECONDS
        value: 60

  - type: worker
    name: pqr-worker
    runtime: python
    rootDir: pqr_web_app
    buildCommand: pip install -r requirements.txt
    startCommand: python run_worker.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: pqr-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: PQR_GOOGLE_SHEET_TAB
        value: Data
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PQR_GOOGLE_SHEET_ID
        sync: false
      - key: PQR_PHIVOLCS_SYNC_SECONDS
        value: 15
      - key: PQR_GOOGLE_SYNC_SECONDS
        value: 60
